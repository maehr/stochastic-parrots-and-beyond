<script>
  // Running clock for the deck of the course day (contents/slides/06-day.qmd).
  // Each slot slide holds a `.slot-meta` span with data-start and data-end.
  // The script adds a countdown to each slot slide. In follow mode, the deck
  // shows the slot of the current local time. Keys:
  //   C   follow the clock on or off
  //   ]   shift the schedule one minute later (the group runs late)
  //   [   shift the schedule one minute earlier
  (function () {
    var follow = true;
    var shift = 0; // minutes
    var navigating = false;
    var slots = [];
    var status;

    function toMinutes(clock) {
      var parts = clock.split(':');
      return Number(parts[0]) * 60 + Number(parts[1]);
    }

    function nowMinutes() {
      var d = new Date();
      return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
    }

    function pad(n) {
      return (n < 10 ? '0' : '') + n;
    }

    function mmss(minutes) {
      var total = Math.max(0, Math.round(minutes * 60));
      return Math.floor(total / 60) + ':' + pad(total % 60);
    }

    function clock(minutes) {
      var m = Math.floor(minutes);
      return pad(Math.floor(m / 60) % 24) + ':' + pad(m % 60);
    }

    function setup() {
      document.querySelectorAll('.reveal .slides section .slot-meta').forEach(function (meta) {
        var section = meta.closest('section');
        var counter = document.createElement('p');
        counter.className = 'countdown';
        counter.setAttribute('role', 'timer');
        counter.setAttribute('aria-live', 'off');
        var bar = document.createElement('div');
        bar.className = 'slot-progress';
        bar.setAttribute('aria-hidden', 'true');
        bar.appendChild(document.createElement('span'));
        var anchor = meta.closest('p') || meta;
        anchor.after(counter, bar);
        slots.push({
          section: section,
          start: toMinutes(meta.dataset.start),
          end: toMinutes(meta.dataset.end),
          counter: counter,
          bar: bar.firstChild
        });
      });
      status = document.createElement('div');
      status.className = 'day-status';
      status.setAttribute('aria-live', 'polite');
      document.querySelector('.reveal').appendChild(status);
      Reveal.addKeyBinding(
        { keyCode: 67, key: 'C', description: 'Follow the clock on or off' },
        function () {
          follow = !follow;
          tick();
        }
      );
      Reveal.addKeyBinding(
        { keyCode: 221, key: ']', description: 'Shift the schedule one minute later' },
        function () {
          shift += 1;
          tick();
        }
      );
      Reveal.addKeyBinding(
        { keyCode: 219, key: '[', description: 'Shift the schedule one minute earlier' },
        function () {
          shift -= 1;
          tick();
        }
      );
      // A manual move stops follow mode. Press C to follow the clock again.
      Reveal.on('slidechanged', function () {
        if (!navigating) follow = false;
        tick();
      });
      tick();
      setInterval(tick, 1000);
    }

    function tick() {
      var now = nowMinutes() - shift;
      slots.forEach(function (slot) {
        var length = slot.end - slot.start;
        var text;
        var done = 0;
        if (now < slot.start) {
          text = 'Starts in ' + mmss(slot.start - now);
        } else if (now < slot.end) {
          text = mmss(slot.end - now) + ' left';
          done = (now - slot.start) / length;
        } else {
          text = 'Time is up';
          done = 1;
        }
        slot.counter.textContent = text;
        slot.counter.classList.toggle('is-up', now >= slot.end);
        slot.bar.style.width = Math.round(done * 100) + '%';
      });
      if (follow) {
        var current = slots.find(function (slot) {
          return now >= slot.start && now < slot.end;
        });
        if (current && Reveal.getCurrentSlide() !== current.section) {
          var idx = Reveal.getIndices(current.section);
          navigating = true;
          Reveal.slide(idx.h, idx.v);
          navigating = false;
        }
      }
      var shiftText = shift === 0 ? '' : ' · Shift: ' + (shift > 0 ? '+' : '') + shift + ' min';
      status.textContent =
        'Clock ' +
        clock(nowMinutes()) +
        ' · Follow: ' +
        (follow ? 'on' : 'off (press C)') +
        shiftText;
    }

    if (window.Reveal && Reveal.isReady()) setup();
    else if (window.Reveal) Reveal.on('ready', setup);
  })();
</script>
