<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="title desc">
  <title id="title">A fictional blocklist excludes a community page</title>
  <desc id="desc">Hypothetical example. Two fictional pages enter a filter: Local history club and Queer history collective. A fictional rule discards pages containing the word queer. The local history page remains; the queer history page is excluded. This illustrates the exclusion mechanism discussed by Bender et al. (2021), not a measurement of a real corpus. Original diagram, CC BY 4.0.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
  <rect width="1000" height="400" fill="#ffffff"/>
  <g font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" fill="#0b0b0b">
    <text x="24" y="35" font-size="30" font-weight="600" fill="#0b0b0b" text-anchor="start">A filtering rule decides whose text remains</text>
    <text x="24" y="72" font-size="21" font-weight="400" fill="#52514e" text-anchor="start">Hypothetical example: fictional pages and a fictional blocklist</text>
    <rect x="24" y="110" width="290" height="200" rx="8" fill="#f2f1ee" stroke="#8f8d88"/>
    <text x="44" y="149" font-size="24" font-weight="600" fill="#0b0b0b" text-anchor="start">Collected pages</text>
    <text x="44" y="200" font-size="23" font-weight="400" fill="#0b0b0b" text-anchor="start">Local history club</text>
    <text x="44" y="254" font-size="23" font-weight="400" fill="#0b0b0b" text-anchor="start">Queer history collective</text>
    <rect x="365" y="140" width="245" height="140" rx="8" fill="#f2f1ee" stroke="#8f8d88"/>
    <text x="385" y="178" font-size="24" font-weight="600" fill="#0b0b0b" text-anchor="start">Fictional rule</text>
    <text x="385" y="218" font-size="22" font-weight="400" fill="#0b0b0b" text-anchor="start">Discard pages with</text>
    <text x="385" y="251" font-size="22" font-weight="400" fill="#0b0b0b" text-anchor="start">the word “queer”</text>
    <path d="M315,210 H355" fill="none" stroke="#52514e" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="680" y="100" width="295" height="95" rx="8" fill="#f2f1ee" stroke="#8f8d88"/>
    <text x="700" y="135" font-size="24" font-weight="600" fill="#0b0b0b" text-anchor="start">Retained</text>
    <text x="700" y="170" font-size="22" font-weight="400" fill="#0b0b0b" text-anchor="start">Local history club</text>
    <rect x="680" y="235" width="295" height="95" rx="8" fill="#dcdbd6" stroke="#8f8d88"/>
    <text x="700" y="270" font-size="24" font-weight="600" fill="#0b0b0b" text-anchor="start">Excluded</text>
    <text x="700" y="307" font-size="21" font-weight="400" fill="#0b0b0b" text-anchor="start">Queer history collective</text>
    <path d="M612,185 H645 V148 H672" fill="none" stroke="#52514e" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M612,235 H645 V280 H672" fill="none" stroke="#52514e" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="24" y="365" font-size="24" font-weight="600" fill="#0b0b0b" text-anchor="start">A cleaner-looking dataset can lose a community&#x27;s voice.</text>
    <text x="24" y="394" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">Concept: Bender et al. (2021), section 4. Original diagram, CC BY 4.0.</text>
  </g>
</svg>
