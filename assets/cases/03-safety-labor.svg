<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="title desc">
  <title id="title">The human work behind a ChatGPT safety detector</title>
  <desc id="desc">Documented Kenya case reported by Perrigo in TIME in 2023. OpenAI commissioned labeling from Sama, which managed data workers in Nairobi. Workers read and labeled text passages. The labels helped train a toxicity detector that was built into ChatGPT. This diagram describes safety labeling, not the separate process of ranking chatbot answers for human-feedback training. Original diagram, CC BY 4.0.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
  <rect width="1000" height="400" fill="#ffffff"/>
  <g font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" fill="#0b0b0b">
    <text x="24" y="35" font-size="30" font-weight="600" fill="#0b0b0b" text-anchor="start">Who commissions, who manages, who reads?</text>
    <text x="24" y="72" font-size="21" font-weight="400" fill="#52514e" text-anchor="start">Documented case: safety labeling in Kenya, reported by TIME (2023)</text>
    <rect x="24" y="110" width="280" height="95" rx="8" fill="#f2f1ee" stroke="#8f8d88"/>
    <text x="44" y="148" font-size="27" font-weight="600" fill="#0b0b0b" text-anchor="start">OpenAI</text>
    <text x="44" y="184" font-size="20" font-weight="400" fill="#0b0b0b" text-anchor="start">Commissions labeling</text>
    <rect x="360" y="110" width="280" height="95" rx="8" fill="#f2f1ee" stroke="#8f8d88"/>
    <text x="380" y="148" font-size="27" font-weight="600" fill="#0b0b0b" text-anchor="start">Sama</text>
    <text x="380" y="184" font-size="20" font-weight="400" fill="#0b0b0b" text-anchor="start">Manages work in Nairobi</text>
    <rect x="695" y="110" width="280" height="95" rx="8" fill="#f2f1ee" stroke="#8f8d88"/>
    <text x="715" y="148" font-size="27" font-weight="600" fill="#0b0b0b" text-anchor="start">Data workers</text>
    <text x="715" y="184" font-size="20" font-weight="400" fill="#0b0b0b" text-anchor="start">Read and label passages</text>
    <path d="M307,155 H350" fill="none" stroke="#52514e" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M643,155 H685" fill="none" stroke="#52514e" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M835,207 V238 H164 V265" fill="none" stroke="#52514e" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="24" y="275" width="280" height="85" rx="8" fill="#f2f1ee" stroke="#8f8d88"/>
    <text x="44" y="309" font-size="25" font-weight="600" fill="#0b0b0b" text-anchor="start">Text labels</text>
    <text x="44" y="343" font-size="19" font-weight="400" fill="#0b0b0b" text-anchor="start">Examples for a detector</text>
    <rect x="360" y="275" width="280" height="85" rx="8" fill="#f2f1ee" stroke="#8f8d88"/>
    <text x="380" y="309" font-size="25" font-weight="600" fill="#0b0b0b" text-anchor="start">Safety detector</text>
    <text x="380" y="343" font-size="19" font-weight="400" fill="#0b0b0b" text-anchor="start">Learns to detect toxicity</text>
    <rect x="695" y="275" width="280" height="85" rx="8" fill="#f2f1ee" stroke="#8f8d88"/>
    <text x="715" y="309" font-size="25" font-weight="600" fill="#0b0b0b" text-anchor="start">ChatGPT</text>
    <text x="715" y="343" font-size="19" font-weight="400" fill="#0b0b0b" text-anchor="start">Detector built into product</text>
    <path d="M307,318 H350" fill="none" stroke="#52514e" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M643,318 H685" fill="none" stroke="#52514e" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="24" y="392" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">Source: Perrigo (2023). This case concerns safety labeling. Original diagram, CC BY 4.0.</text>
  </g>
</svg>
