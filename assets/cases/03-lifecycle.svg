<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Six stages of the course lifecycle framework</title>
  <desc id="desc">Design, data, training, deployment, evaluation, governance, connected in a cycle. The short descriptions are choose the purpose, collect and label, fit the model, provide access, test and monitor, set rules and recourse. Evaluation repeats and governance applies at every stage. Framework based on Huber and Mähr, Decoding Inequality (2024, updated 2025). Original diagram by Laura Wagner and Moritz Mähr (2026), CC BY 4.0. Suresh and Guttag (2021) are a source on lifecycle harms, not the authors of these six stages.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
  <rect width="1000" height="400" fill="#ffffff"/>
  <g font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" fill="#0b0b0b">
    <text x="24" y="35" font-size="28" font-weight="600" fill="#0b0b0b" text-anchor="start">Six stages for asking who works and who carries risk</text>
    <rect x="24" y="65" width="280" height="100" rx="8" fill="#f2f1ee" stroke="#8f8d88"/>
    <text x="42" y="103" font-size="26" font-weight="600" fill="#0b0b0b" text-anchor="start">1  Design</text>
    <text x="42" y="142" font-size="22" font-weight="400" fill="#0b0b0b" text-anchor="start">Choose the purpose</text>
    <rect x="360" y="65" width="280" height="100" rx="8" fill="#f2f1ee" stroke="#8f8d88"/>
    <text x="378" y="103" font-size="26" font-weight="600" fill="#0b0b0b" text-anchor="start">2  Data</text>
    <text x="378" y="142" font-size="22" font-weight="400" fill="#0b0b0b" text-anchor="start">Collect and label</text>
    <rect x="695" y="65" width="280" height="100" rx="8" fill="#f2f1ee" stroke="#8f8d88"/>
    <text x="713" y="103" font-size="26" font-weight="600" fill="#0b0b0b" text-anchor="start">3  Training</text>
    <text x="713" y="142" font-size="22" font-weight="400" fill="#0b0b0b" text-anchor="start">Fit the model</text>
    <rect x="695" y="215" width="280" height="100" rx="8" fill="#f2f1ee" stroke="#8f8d88"/>
    <text x="713" y="253" font-size="26" font-weight="600" fill="#0b0b0b" text-anchor="start">4  Deployment</text>
    <text x="713" y="292" font-size="22" font-weight="400" fill="#0b0b0b" text-anchor="start">Provide access</text>
    <rect x="360" y="215" width="280" height="100" rx="8" fill="#f2f1ee" stroke="#8f8d88"/>
    <text x="378" y="253" font-size="26" font-weight="600" fill="#0b0b0b" text-anchor="start">5  Evaluation</text>
    <text x="378" y="292" font-size="22" font-weight="400" fill="#0b0b0b" text-anchor="start">Test and monitor</text>
    <rect x="24" y="215" width="280" height="100" rx="8" fill="#f2f1ee" stroke="#8f8d88"/>
    <text x="42" y="253" font-size="26" font-weight="600" fill="#0b0b0b" text-anchor="start">6  Governance</text>
    <text x="42" y="292" font-size="22" font-weight="400" fill="#0b0b0b" text-anchor="start">Set rules and recourse</text>
    <path d="M307,115 H350" fill="none" stroke="#52514e" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M643,115 H685" fill="none" stroke="#52514e" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M835,168 V205" fill="none" stroke="#52514e" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M690,265 H650" fill="none" stroke="#52514e" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M355,265 H315" fill="none" stroke="#52514e" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M164,210 V175" fill="none" stroke="#52514e" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="24" y="349" font-size="24" font-weight="600" fill="#0b0b0b" text-anchor="start">Evaluation repeats. Governance applies at every stage.</text>
    <text x="24" y="373" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">Framework: Huber and Mähr (2024; updated 2025). Diagram: Wagner and Mähr (2026), CC BY 4.0.</text>
    <text x="24" y="393" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">Research on sources of lifecycle harm: Suresh and Guttag (2021).</text>
  </g>
</svg>
