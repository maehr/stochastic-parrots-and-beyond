  <text x="36" y="162" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-style="italic" fill="#52514e">People, rules, tools, money, habits.</text>
  <text x="36" y="176" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-style="italic" fill="#52514e">One per line.</text>
