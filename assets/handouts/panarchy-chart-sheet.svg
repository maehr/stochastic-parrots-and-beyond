  <text x="24" y="628" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#52514e">Adapted from Liberating Structures (Lipmanowicz, McCandless, White; liberatingstructures.com, Fieldbook 2026). CC BY-SA 4.0. Original drawing.</text>
