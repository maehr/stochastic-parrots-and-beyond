<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="title desc">
  <title id="title">Panarchy Chart (Sheet 1, back)</title>
  <desc id="desc">Panarchy Chart for one participant, in A4 landscape. At the top, a field for the challenge in one sentence, with the hint: start from your Research Use Card. On the left, a ruled field titled Influences, with the hint: people, rules, tools, money, habits, one per line. On the right, five horizontal bands stacked from bottom to top: level 1, small and fast, at the bottom, and level 5, large and slow, at the top. Each band has a field for its level name. An arrow on the left points up and reads: ideas and experiments spread up. An arrow on the right points down and reads: resources and rules flow down. Adapted from Liberating Structures (Lipmanowicz, McCandless, White; liberatingstructures.com, Fieldbook 2026). CC BY-SA 4.0.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33322f"/></marker>
  </defs>
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="24" y="30" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#0b0b0b">Panarchy Chart</text>
  <rect x="24" y="44" width="952" height="66" rx="6" fill="#ffffff" stroke="#33322f" stroke-width="1.2"/>
  <text x="36" y="63" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0b0b0b">Challenge (one sentence)</text>
  <text x="212" y="63" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-style="italic" fill="#52514e">Start from your Research Use Card.</text>
