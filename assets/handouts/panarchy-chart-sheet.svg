  <line x1="36" y1="102" x2="964" y2="102" stroke="#8f8d88" stroke-width="1"/>
  <rect x="24" y="124" width="236" height="476" rx="6" fill="#f2f1ee" stroke="#33322f" stroke-width="1.2"/>
